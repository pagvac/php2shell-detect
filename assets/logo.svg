<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="php2shell-detect logo">
  <defs>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#7c6ff0"/>
      <stop offset="0.45" stop-color="#b06cff"/>
      <stop offset="0.75" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#ffcf5c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6ff0"/>
      <stop offset="1" stop-color="#32d6c6"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="756" height="246" rx="18" fill="#0d1117" stroke="#273043" stroke-width="2"/>

  <!-- mac-style window dots, just for fun -->
  <circle cx="30" cy="28" r="5.5" fill="#ff5f57"/>
  <circle cx="48" cy="28" r="5.5" fill="#febc2e"/>
  <circle cx="66" cy="28" r="5.5" fill="#28c840"/>
  <text x="92" y="32" font-size="12.5" fill="#5b667a">— php2shell-detect ——————————————————————————————————————————</text>

  <!-- wordmark: figlet "slant" ASCII, colored by gradient -->
  <text xml:space="preserve" x="34" y="78" font-size="20" font-weight="bold" fill="url(#wm)" filter="url(#glow)" letter-spacing="0.5">
    <tspan x="34" dy="0">           __         ___        __         ____</tspan>
    <tspan x="34" dy="23">    ____  / /_  ____ |__ \ _____/ /_  ___  / / /</tspan>
    <tspan x="34" dy="23">   / __ \/ __ \/ __ \__/ // ___/ __ \/ _ \/ / / </tspan>
    <tspan x="34" dy="23">  / /_/ / / / / /_/ / __/(__  ) / / /  __/ / /  </tspan>
    <tspan x="34" dy="23"> / .___/_/ /_/ .___/____/____/_/ /_/\___/_/_/   </tspan>
    <tspan x="34" dy="23">/_/         /_/                                 </tspan>
  </text>

  <!-- accent bar -->
  <rect x="36" y="206" width="470" height="3" rx="1.5" fill="url(#bar)"/>

  <!-- tagline -->
  <text x="36" y="230" font-size="13.5" fill="#aab3c5">
    <tspan fill="#28c840">php&#160;&#8250;</tspan>
    <tspan fill="#aab3c5">&#160;remote PHP version detector &#38; </tspan><tspan fill="#ff8aa6">PHP2Shell</tspan><tspan fill="#aab3c5"> triage &#183; </tspan><tspan fill="#8b93a7">CVE-2026-109618/19</tspan>
  </text>
</svg>
